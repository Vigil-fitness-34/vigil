<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIGIL">
<meta name="description" content="VIGIL – Trainingslog für Kraft, Laufen und Boxen. Progression, Rekorde und Statistiken. Offline.">
<title>VIGIL · Training</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;--s1:#131315;--s2:#1a1a1d;--s3:#232327;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --text:#f4f4f5;--muted:#9a9aa1;--dim:#63636b;
  --acc:#d8b56d;--acc-s:rgba(216,181,109,.12);--good:#5fd38d;--bad:#ff6b6b;--warn:#ffb35c;--blue:#7aa2ff;
  --r:18px;--r2:14px;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--head:var(--font);
  --nav:calc(64px + env(safe-area-inset-bottom));color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) 0 calc(var(--nav) + 24px);min-height:100vh;overscroll-behavior-y:none}
body.timer-on{padding-bottom:calc(var(--nav) + 96px)}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
p{margin:0 0 10px}
b{font-weight:600}
.num,.v,.bigval,input{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
main{max-width:560px;margin:0 auto;padding:12px 16px 0}
.muted{color:var(--muted)}.dim{color:var(--dim)}.sm{font-size:13.5px}
.row{display:flex;align-items:center;gap:8px}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.up-c{color:var(--good)}.down-c{color:var(--bad)}.eq-c{color:var(--muted)}

/* headings */
.ph{padding:18px 2px 18px}
.kicker,.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ph h1,.page-title{font-size:32px;line-height:1.1;margin-top:6px;font-weight:700;letter-spacing:-.03em}
main h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 4px 10px;display:flex;align-items:center;gap:8px}
.sheet h2{font-size:22px;letter-spacing:-.02em;color:var(--text);text-transform:none;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
h3{font-size:17px;font-weight:600;letter-spacing:-.01em}

/* surfaces */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.hero{padding:20px}
.empty{text-align:center;color:var(--muted);padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14.5px}
.empty .ic{color:var(--dim)}
.divider{height:1px;background:var(--line);margin:14px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r2);background:var(--s2);border:1px solid var(--line);font-weight:600;font-size:15.5px;transition:transform .12s,background .15s}
.btn:active{transform:scale(.98);background:var(--s3)}
.btn.primary{background:var(--text);color:#0a0a0b;border-color:transparent}
.btn.primary:active{background:#dcdce0}
.btn.acc{background:var(--acc);color:#1a1408;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.block{display:flex;width:100%}.btn.xl{min-height:56px;font-size:16.5px;border-radius:16px}.btn.sm{min-height:40px;padding:0 14px;font-size:14.5px}
.btn.danger,.mrow.danger{color:var(--bad)}.btn.danger-fill{background:var(--bad);color:#fff;border-color:transparent}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:active{background:var(--s2)}
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill.y,.pill.acc{background:var(--acc-s);border-color:transparent;color:var(--acc)}
.pill.warn{background:rgba(255,179,92,.12);border-color:transparent;color:var(--warn)}
.pill.g{background:rgba(95,211,141,.12);border-color:transparent;color:var(--good)}

/* forms */
.inp{width:100%;min-height:48px;padding:0 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line);outline:none;font-size:16px}
.inp:focus{border-color:var(--line2);background:var(--s3)}
textarea.inp{min-height:96px;padding:12px 14px;resize:vertical;line-height:1.45}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin:0 0 6px 2px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.tgl:last-child{border-bottom:0}
.tgl input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:background .2s;margin:0;cursor:pointer}
.tgl input::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tgl input:checked{background:var(--good)}.tgl input:checked::after{transform:translateX(20px)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-height:52px}
.srow:last-child{border-bottom:0}
.mini-step{display:inline-flex;align-items:center;gap:4px;background:var(--s2);border-radius:12px;padding:3px}
.mini-step button{width:38px;height:36px;border-radius:9px;font-size:20px;color:var(--muted)}.mini-step button:active{background:var(--s3)}
.mini-step b{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}

/* lists */
.list{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);min-height:64px}
.li:last-child{border-bottom:0}.li:active{background:var(--s2)}
.li b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{display:block;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.li>.ic{color:var(--dim)}
.day{width:42px;height:42px;border-radius:12px;background:var(--s2);display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);flex:none}
.li.today .day{background:var(--text);color:#0a0a0b}
.date{width:42px;flex:none;text-align:center;line-height:1.1}
.date b{font-size:20px;font-weight:700;display:block}.date small{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.more{display:block;width:100%;padding:13px;text-align:center;color:var(--muted);font-size:14.5px;font-weight:500}

/* home */
.today{padding:20px;background:linear-gradient(180deg,#18181b,#121214);border-color:var(--line2)}
.today h2{font-size:28px;letter-spacing:-.03em;text-transform:none;color:var(--text);margin:8px 0 4px;display:block}
.today p{color:var(--muted);font-size:14.5px;margin:0 0 16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.today-meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;margin:0 0 18px}
.today-meta span{display:inline-flex;align-items:center;gap:6px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--dim);letter-spacing:.04em}
.wk i{width:34px;height:34px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:#0a0a0b}
.wk .on i{background:var(--acc)}.wk .on{color:var(--text)}
.wk .td i{box-shadow:inset 0 0 0 1.5px var(--text)}.wk .td{color:var(--text)}.wk .on.td i{box-shadow:none}
.wk-top>div>b{font-size:22px;font-weight:700;letter-spacing:-.02em}.wk-top>div>b small{font-size:15px;color:var(--muted);font-weight:500}
.streak{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}.streak .ic{color:var(--acc)}.streak b{color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:4px 0 2px;line-height:1.1}.kpi .v small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .d{font-size:12.5px;font-weight:500}
.recs .li{min-height:56px;padding:12px 16px}
.recs .li .ri{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--s2);color:var(--muted);flex:none}
.recs .up .ri{background:rgba(95,211,141,.12);color:var(--good)}.recs .deload .ri{background:rgba(255,179,92,.12);color:var(--warn)}.recs .return .ri{background:rgba(122,162,255,.12);color:var(--blue)}
.recs .li span.t{font-size:14.5px;line-height:1.35}

/* workout */
.wo-h{display:flex;align-items:flex-end;gap:12px;padding:16px 2px 14px}
.wo-h h1{font-size:28px;letter-spacing:-.03em;margin-top:4px}
.progress{height:4px;background:var(--s2);border-radius:99px;overflow:hidden;margin:0 0 6px}
.progress i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.wo-count{font-size:13px;color:var(--muted);margin:0 2px 14px;font-variant-numeric:tabular-nums}
.ex{padding:0;overflow:hidden}
.ex-h{display:flex;align-items:center;gap:12px;padding:14px 8px 10px 16px}
.ex-n{width:30px;height:30px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.ex.complete .ex-n{background:var(--good);color:#0a0a0b}
.ex.complete{border-color:rgba(95,211,141,.25)}
.ex.skipped{opacity:.5}
.ex-h h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-h .muted{margin-top:1px}
.ex>.btn{margin:0 16px 16px;width:calc(100% - 32px)}
.rec{display:flex;gap:10px;align-items:flex-start;margin:0 16px 8px;padding:10px 12px;border-radius:12px;background:var(--s2);font-size:13.5px;color:var(--muted);line-height:1.4}
.rec .ic{margin-top:1px}
.rec.up{background:rgba(95,211,141,.09);color:#b4ecc9}.rec.up .ic{color:var(--good)}
.rec.deload{background:rgba(255,179,92,.09);color:#ffd8ab}.rec.deload .ic{color:var(--warn)}
.rec.return{background:rgba(122,162,255,.09);color:#c6d6ff}.rec.return .ic{color:var(--blue)}
.last{margin:0 16px 10px;font-size:13px;color:var(--dim)}.last b{color:var(--muted);font-weight:500}
.set{margin:0 10px 8px;padding:12px;border-radius:14px;background:var(--s2)}
.set-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.set-no{flex:1;font-size:13px;font-weight:600;color:var(--muted);padding-left:2px}
.rpe-btn{height:34px;padding:0 12px;border-radius:10px;background:var(--s3);font-size:13px;font-weight:600;color:var(--muted)}
.rpe-btn.on{color:var(--acc)}
.check{width:52px;height:44px;border-radius:12px;background:var(--text);color:#0a0a0b;display:grid;place-items:center}
.check:active{transform:scale(.95)}
.steppers{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.stepper{display:flex;align-items:stretch;height:58px;background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card .stepper{background:var(--s2)}
.stepper>button{width:46px;flex:none;font-size:24px;font-weight:400;color:var(--muted)}
.stepper>button:active{background:var(--s3);color:var(--text)}
.stepper .val{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stepper input{width:100%;background:none;border:0;outline:none;text-align:center;font-size:22px;font-weight:700;letter-spacing:-.02em;padding:0}
.stepper .u{font-size:10.5px;color:var(--dim);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:-2px}
.set.done{display:flex;align-items:center;gap:12px;width:calc(100% - 20px);text-align:left;background:transparent;border:1px solid var(--line);padding:10px 12px;min-height:50px}
.set.done .ck{width:24px;height:24px;border-radius:50%;background:var(--good);color:#0a0a0b;display:grid;place-items:center;flex:none}
.set.done .sn{font-size:13px;color:var(--dim);font-weight:600;width:14px}
.set.done .sv{flex:1;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.rpe-chip{font-size:12px;font-weight:600;color:var(--muted);background:var(--s2);padding:3px 8px;border-radius:8px}
.set.done .undo{font-size:12.5px;color:var(--dim)}
.ex-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 10px 12px}
.ex-actions .btn{background:transparent;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--s2);border-radius:14px;padding:12px 14px}
.tile .l{font-size:12.5px;color:var(--muted);font-weight:500}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-top:2px;line-height:1.15}
.tile .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.tile .d{font-size:12.5px;margin-top:2px}
.rpe-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rpe-grid button{min-height:58px;border-radius:12px;background:var(--s2);font-size:19px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.rpe-grid button small{font-size:10px;font-weight:500;color:var(--muted)}
.rpe-grid button.on{background:var(--text);color:#0a0a0b}.rpe-grid button.on small{color:#333}

/* stats */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;margin:0 0 16px;position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:5;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(19,19,21,.85)}
.seg button{height:38px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--s3);color:var(--text)}
.bigval{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-top:4px}
.bigval small{font-size:17px;color:var(--muted);font-weight:500;margin-left:5px;letter-spacing:0}
.verdict{font-size:40px;font-weight:700;letter-spacing:-.04em;margin-top:4px}
.weekpips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.weekpips div{text-align:center;font-size:11px;font-weight:600;color:var(--dim)}
.weekpips span{display:block;height:6px;border-radius:99px;background:var(--s3);margin-top:6px}
.weekpips .on{color:var(--text)}.weekpips .on span{background:var(--acc)}
.bar{height:6px;background:var(--s3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.pbar{position:relative;height:6px;background:var(--s3);border-radius:99px;margin:30px 0 30px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#3a3a40,var(--acc))}
.pbar b{position:absolute;top:-5px;width:4px;height:16px;background:#fff;border-radius:2px;transform:translateX(-50%)}
.pbar span{position:absolute;top:14px;font-size:10px;color:var(--dim);transform:translateX(-50%);white-space:nowrap;font-weight:500}
.pbar span.t{top:-20px}
.chart{display:block;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px}
.rt{width:100%;border-collapse:collapse}
.rt td{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
.rt tr:last-child td{border-bottom:0}
.rt td.n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;font-size:14.5px}
.pr-row .ic{color:var(--acc)}
.pr-row .sm{color:var(--muted)}

/* sheets & dialogs */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.overlay.center{align-items:center;padding:24px}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:#141416;border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);overscroll-behavior:contain}
.grab{width:38px;height:5px;border-radius:99px;background:var(--s3);margin:4px auto 14px}
.dlg{width:100%;max-width:380px;background:#17171a;border:1px solid var(--line2);border-radius:20px;padding:22px 20px 16px;animation:pop .2s}
.dlg p{font-size:16px;margin:0 0 18px;line-height:1.45}
.dlg-b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes pop{from{transform:scale(.95);opacity:0}}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 14px;border-radius:14px;background:var(--s2);margin-bottom:8px;font-weight:500;text-align:left}
.mrow:active{background:var(--s3)}
.plist{max-height:44vh;overflow-y:auto;margin:10px 0 14px;border-radius:14px;background:var(--s2)}
.prow{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:50px;padding:0 14px;border-bottom:1px solid var(--line);text-align:left}
.prow:last-child{border-bottom:0}.prow:active{background:var(--s3)}
.ti{background:var(--s2);border-radius:14px;padding:10px;margin-bottom:8px}
.ti-top{display:flex;gap:4px;align-items:center}.ti-top .inp{flex:1;min-width:0;background:var(--s1)}
.ti-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.ti-grid label{font-size:11px;color:var(--muted);font-weight:500}.ti-grid .inp{min-height:42px;padding:0 8px;text-align:center;background:var(--s1);margin-top:3px}
.sum-hero{text-align:center;padding:10px 0 4px}

.timerbar.ending .t-fill{background:rgba(255,107,107,.18)}.timerbar.ending #t-time{color:var(--bad)}

<body>
<main id="view"></main>

<div id="timerbar" class="timerbar" hidden>
  <div class="t-in">
    <button data-a="t-minus" aria-label="15 Sekunden weniger">−15</button>

<nav class="nav"><div class="nav-in" id="nav"></div></nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================
   VIGIL – Trainingslog. Alle Daten lokal (localStorage).
   ========================================================= */
const KEY='vigil.data.v1', UIKEY='vigil.ui.v1', VERSION=1, APPVER='2.0.0';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0;};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmt=(n,d=1)=>(n==null||!isFinite(n))?'–':(Math.round(n*10**d)/10**d).toLocaleString('de-DE',{maximumFractionDigits:d});
const fmtKg=n=>fmt(n,2);
const fmtInput=v=>String(Math.round(num(v)*100)/100).replace('.',',');
const fmtT=kg=>kg>=1000?fmt(kg/1000,1)+' t':fmt(kg,0)+' kg';
const pad=n=>String(n).padStart(2,'0');
const dayKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDay=k=>{const [y,m,d]=String(k).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const weekKey=d=>dayKey(mondayOf(d));
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const daysBetween=(a,b)=>Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);
const DAYS=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const DSHORT=['SO','MO','DI','MI','DO','FR','SA'];
const fmtDate=ts=>{const d=new Date(ts);return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.`;};
const fmtDateLong=ts=>new Date(ts).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtSec=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${pad(s%60)}`;};
const fmtDur=ms=>{const m=Math.floor(ms/60000);return m>=60?`${Math.floor(m/60)}:${pad(m%60)} h`:`${m}:${pad(Math.floor(ms/1000)%60)}`;};
const fmtMin=ms=>{const m=Math.max(1,Math.round(ms/60000));return m>=60?`${Math.floor(m/60)} h ${pad(m%60)}`:`${m} min`;};
const e1rm=(w,r)=>(w>0&&r>0)?(r===1?w:w*(1+r/30)):0;
const deep=o=>JSON.parse(JSON.stringify(o));


/* ---------- icons ---------- */
const P={
  dumbbell:'M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12',
  chart:'M4 20V11M10 20V4M16 20v-7M2 20h20',
  shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
  user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-6 8-6s8 2 8 6',
  play:'M7 4.5v15l12-7.5z', plus:'M12 5v14M5 12h14', minus:'M5 12h14', x:'M6 6l12 12M18 6 6 18', check:'M4 12.5l5 5L20 6.5',
  dots:'M5 12h.01M12 12h.01M19 12h.01', swap:'M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7', skip:'M5 5l10 7-10 7zM19 5v14',
  trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3', edit:'M4 20h4L20 8l-4-4L4 16z',
  download:'M12 3v12M7 10l5 5 5-5M4 21h16', upload:'M12 15V3M7 8l5-5 5 5M4 21h16',
  up:'M12 19V5M5 12l7-7 7 7', down:'M12 5v14M19 12l-7 7-7-7', upr:'M7 17 17 7M8 7h9v9',
  timer:'M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM12 9v4l2.5 2M10 2h4',
  trophy:'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4',
  bolt:'M13 2 4 14h7l-1 8 9-12h-7z', flame:'M12 3c.8 4 6 6 6 11a6 6 0 0 1-12 0c0-3 1.6-5 3-6.5.6 2 1.5 3 3 3.5-.5-2.5-.8-5 0-8z',
  star:'M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3l-5.5 2.9 1-6.2L3 9.6l6.2-.9z',
  moon:'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z', target:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01',
  scale:'M5 4h14l1 16H4zM9 9a3 3 0 0 1 6 0M12 9l1.5-1.5', run:'M14 5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM5 21l4-6 3 2 1-6-3-1-3 3M13 11l3 3 4 .5M9 7l4-1 3 3',
  lock:'M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4', note:'M5 3h14v18H5zM9 8h6M9 12h6M9 16h4', flag:'M5 21V4h12l-2 4 2 4H5',
  medal:'M8 3l4 6 4-6M12 21a6 6 0 1 0 0-12 6 6 0 0 0 0 12z', info:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v6M12 7.5h.01',
  mountain:'M3 20l6-10 4 6 3-4 5 8z', paw:'M12 21c-3 0-5-2-5-4s2.5-4 5-4 5 2 5 4-2 4-5 4zM6 11.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 11.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9.5 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM14.5 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4z', bag:'M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2', snow:'M12 2v20M3.5 7l17 10M20.5 7l-17 10M9 4l3 2 3-2M9 20l3-2 3 2', crescent:'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z', hold:'M6 12h12M6 8h12M6 16h12',
  chev:'M9 6l6 6-6 6', cal:'M4 6h16v15H4zM4 10h16M8 3v4M16 3v4', gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z',
};
const icon=(n,s=22,w=2)=>`<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${n==='dots'?3.2:w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]||''}"/></svg>`;

/* ---------- defaults ---------- */
function defaultExercises(){
  const L=(id,name,o={})=>({id,name,metric:'reps',load:'weight',step:2.5,big:false,...o});
  return [
    L('squat','Kniebeuge',{big:true}),L('bench','Bankdrücken'),L('row','Rudern'),L('rdl','Rumänisches Kreuzheben'),
    L('farmer',"Farmer's Walk",{metric:'m'}),L('plank','Plank',{metric:'s',load:'bw'}),
    L('deadlift','Kreuzheben',{big:true}),L('ohp','Schulterdrücken'),L('pullup','Klimmzüge',{load:'bw'}),
    L('lunge','Ausfallschritte (pro Bein)'),L('kneeraise','Knieheben hängend',{load:'bw'}),L('kbswing','Kettlebell Swings'),
  ];
}
function defaultTemplates(){
  const I=(exId,sets,repMin,repMax,rest)=>({exId,sets,repMin,repMax,rest});
  return [
    {id:'tA',name:'Kraft A',day:1,kind:'strength',items:[I('squat',4,6,8,150),I('bench',4,6,8,150),I('row',3,8,10,120),I('rdl',3,8,10,120),I('farmer',3,30,30,90),I('plank',3,30,45,60)]},
    {id:'tB',name:'Kraft B',day:2,kind:'strength',items:[I('deadlift',4,5,5,180),I('ohp',4,6,8,120),I('pullup',4,null,null,120),I('lunge',3,10,10,90),I('kneeraise',3,10,12,60),I('kbswing',5,15,15,60)]},
    {id:'tBox',name:'Boxen',day:6,kind:'boxing',items:[]},
    {id:'tRun',name:'Laufen',day:0,kind:'run',items:[]},
  ];
}
function defaultState(){
  return {version:VERSION,created:Date.now(),
    profile:{name:'',startWeight:100,goalWeight:85,campaignStart:dayKey(mondayOf(new Date())),restSec:120,autoTimer:true,bigStep5:false,vibrate:true,sound:true,wakeLock:true,weeklyTarget:4,sex:'m',birthYear:'',height:''},
    exercises:defaultExercises(),templates:defaultTemplates(),sessions:[],bodyweight:[],active:null};
}
function migrate(d){
  const def=defaultState();
  const o={...def,...d};
  o.profile={...def.profile,...(d.profile||{})};
  for(const k of ['exercises','templates','sessions','bodyweight']) if(!Array.isArray(o[k])) o[k]=def[k];
  o.sessions=o.sessions.filter(s=>s&&s.id&&s.start);
  o.sessions.forEach(s=>{s.entries=Array.isArray(s.entries)?s.entries:[];s.entries.forEach(e=>{e.sets=Array.isArray(e.sets)?e.sets:[];e.target=e.target||{};});});
  o.bodyweight=o.bodyweight.filter(e=>e&&e.date&&num(e.kg)>0).map(e=>({date:e.date,kg:num(e.kg)}));
  if(o.active&&!Array.isArray(o.active.entries)) o.active=null;
  delete o.app; delete o.exportedAt; o.version=VERSION;
  return o;
}

/* ---------- storage ---------- */
let S, saveT=null;
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){console.error(e);setTimeout(()=>toast('Speicher nicht verfügbar (privater Modus?) – Daten werden nicht gesichert.','err',6000),300);return defaultState();}
  if(!raw) return defaultState();
  try{return migrate(JSON.parse(raw));}
  catch(e){
    console.error(e);
    try{localStorage.setItem(KEY+'.corrupt.'+Date.now(),raw);}catch{}
    setTimeout(()=>toast('Gespeicherte Daten beschädigt – Kopie gesichert, Neustart mit leeren Daten. Nutze ggf. deinen JSON-Import.','err',7000),300);
    return defaultState();
  }
}
function writeNow(){
  clearTimeout(saveT); saveT=null;
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){console.error(e);toast('Speichern fehlgeschlagen! Speicher voll? Bitte Daten exportieren.','err',5000);}
}
function save(now){invalidate(); clearTimeout(saveT); if(now) writeNow(); else saveT=setTimeout(writeNow,250);}
let prCache=null, xpCache=null, sortedCache=null;
function invalidate(){prCache=null;xpCache=null;sortedCache=null;}

const ui={tab:'train',seg:'week',statEx:null};
function loadUI(){try{Object.assign(ui,JSON.parse(localStorage.getItem(UIKEY)||'{}'));}catch{}if(!['train','log','stats','profile'].includes(ui.tab))ui.tab='train';}
function persistUI(){try{localStorage.setItem(UIKEY,JSON.stringify({tab:ui.tab,seg:ui.seg,statEx:ui.statEx}));}catch{}}

/* ---------- domain helpers ---------- */
const exById=id=>S.exercises.find(x=>x.id===id)||{id,name:'Unbekannte Übung',metric:'reps',load:'weight',step:2.5};
const metricUnit=ex=>ex.metric==='m'?'m':ex.metric==='s'?'Sek':'Wdh';

function sortedSessions(){return sortedCache||(sortedCache=[...S.sessions].sort((a,b)=>a.start-b.start));}
function exHistory(exId,excludeId){
  const out=[];

    if(ex.metric==='reps') c.e1rm=Math.max(c.e1rm,e1rm(w,r));
    if(r>0) c.w=Math.max(c.w,w);

const doneSets=s=>(s.entries||[]).filter(e=>!e.skipped).reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);

/* ---------- PRs (derived) ---------- */
function derivedPR(){
  if(prCache) return prCache;
  const bests={},sessionPRs={},prList=[];
  for(const s of sortedSessions()){
    let n=0; const seen=new Set();
    if(s.kind==='strength') for(const e of s.entries||[]){
      if(e.skipped) continue;
      const ex=exById(e.exId), d=e.sets.filter(x=>x.done); if(!d.length) continue;
      const cur=aggSets(d,ex), b=bests[e.exId];
      if(b){
        const kinds=[];
        if(cur.e1rm>0&&cur.e1rm>b.e1rm+1e-6) kinds.push('e1rm');
        if(cur.w>0&&cur.w>b.w+1e-6) kinds.push('w');
        if(ex.load==='bw'&&cur.w<=0&&b.w<=0&&cur.reps>b.reps) kinds.push('reps');
        if(kinds.length&&!seen.has(e.exId)){n++;seen.add(e.exId);prList.push({sid:s.id,exId:e.exId,start:s.start,kinds,cur});}
        bests[e.exId]={e1rm:Math.max(b.e1rm,cur.e1rm),w:Math.max(b.w,cur.w),vol:Math.max(b.vol,cur.vol),reps:Math.max(b.reps,cur.reps),n:b.n+1};
      } else bests[e.exId]={...cur,n:1};
    }
    sessionPRs[s.id]=n;
  }
  return prCache={bests,sessionPRs,prList};
}
function prText(p){
  const ex=exById(p.exId);

  if(p.kinds.includes('w')) return `${ex.name}: ${fmtKg(p.cur.w)} kg`;
  return `${ex.name}: ${fmt(p.cur.reps,0)} ${metricUnit(ex)}`;
}

/* ---------- recommendations (double progression) ---------- */
function score(sets,ex){
  const w=Math.max(...sets.map(s=>num(s.w)));
  if(ex.metric==='reps'&&w>0) return Math.max(...sets.map(s=>e1rm(num(s.w),num(s.r))));
  if(w>0) return w*1000+Math.max(...sets.map(s=>num(s.r)));
  return sets.reduce((a,s)=>a+num(s.r),0);
}
function recommend(exId,target={},excludeId){
  const ex=exById(exId), H=exHistory(exId,excludeId), name=ex.name, unit=metricUnit(ex);
  if(!H.length) return {type:'new',w:null,reps:null,text:`${name}: erstes Mal – Startgewicht wählen`};
  const last=H[H.length-1], lw=Math.max(...last.sets.map(s=>num(s.w))), st=stepFor(ex);
  const lt=last.entry.target||{};
  const repMin=target.repMin!==undefined?target.repMin:(lt.repMin??null);
  const repMax=target.repMax!==undefined?target.repMax:(lt.repMax??null);
  const lastReps=last.sets.map(s=>num(s.r));
  if(last.entry.deload){
    const w=num(last.entry.deloadFrom)||roundTo(lw/0.9,2.5);
    return {type:'return',w,reps:lastReps,text:`${name}: Deload vorbei – zurück auf ${wLabel(w,ex)}`};
  }
  let stalls=0;
  for(let i=H.length-1;i>0;i--){
    if(H[i].entry.deload||H[i-1].entry.deload) break;
    if(score(H[i].sets,ex)>score(H[i-1].sets,ex)+1e-9) break;
    stalls++;
  }
  if(stalls>=3&&lw>0){
    const w=Math.floor(lw*0.9/2.5)*2.5;
    return {type:'deload',w,from:lw,reps:lastReps,text:`${name}: 3× Stillstand – Deload: ${fmtKg(w)} kg (−10 %) für eine Woche`};
  }
  const fail=h=>repMin!=null&&h.sets.some(s=>num(s.r)<repMin);
  if(H.length>=2&&fail(last)&&fail(H[H.length-2]))
    return {type:'hold',w:lw,reps:lastReps,text:`${name}: ${wLabel(lw,ex)} halten – 2× unter ${repMin} ${unit}. Sauber bleiben, gut schlafen.`};
  const tSets=lt.sets||target.sets||last.sets.length;
  if(repMax!=null&&last.sets.length>=tSets&&last.sets.every(s=>num(s.r)>=repMax)){
    const w=Math.round((lw+st)*100)/100;
    const txt=(ex.load==='bw'&&lw<=0)?(lw<0?`${name}: nächstes Mal ${wLabel(w,ex)}`:`${name}: obere Grenze geschafft – nächstes Mal +${fmtKg(st)} kg Zusatzgewicht`):`${name}: nächstes Mal ${fmtKg(w)} kg`;
    return {type:'up',w,reps:last.sets.map(()=>repMin??repMax),text:txt};
  }
  if(repMax==null){
    const tot=lastReps.reduce((a,b)=>a+b,0);
    return {type:'same',w:lw,reps:lastReps,text:`${name}: Ziel ${fmt(tot+1,0)} ${unit} gesamt (letztes Mal ${fmt(tot,0)})`};
  }
  return {type:'same',w:lw,reps:lastReps,text:`${name}: ${wLabel(lw,ex)} halten – Ziel: ${repMax} ${unit} in allen Sätzen`};
}

/* ---------- 12-week cycle / streak / weeks ---------- */
const PHASES=[{name:'Fundament',w:'Woche 1–4',desc:'Technik sauber, Basis legen'},{name:'Aufbau',w:'Woche 5–8',desc:'Gewichte konsequent steigern'},{name:'Peak',w:'Woche 9–12',desc:'Volle Intensität, neue Rekorde'}];

  const end=addDays(start,84).getTime(), t0=start.getTime();

function weekCounts(){const m={};for(const s of S.sessions){const k=weekKey(new Date(s.start));m[k]=(m[k]||0)+1;}return m;}

/* ---------- strength standards & percentiles (estimate) ---------- */
const MAIN=['squat','bench','deadlift','ohp'];
const STD={m:{ref:80,squat:[.75,1.25,1.5,2.25,2.75],bench:[.5,.75,1.25,1.75,2],deadlift:[1,1.5,2,2.5,3],ohp:[.35,.55,.8,1.05,1.35]},
           f:{ref:60,squat:[.5,.75,1.25,1.5,2],bench:[.25,.5,.75,1,1.5],deadlift:[.5,1,1.25,1.75,2.5],ohp:[.2,.35,.5,.75,1]}};
const STD_P=[5,20,50,80,95], LEVELS=['Anfänger','Einsteiger','Fortgeschritten','Stark','Elite'];
const sexKey=()=>S.profile.sex==='f'?'f':'m';
function ageNow(){const y=num(S.profile.birthYear);const a=new Date().getFullYear()-y;return y>1900&&a>=10&&a<100?a:null;}
function ageFactor(a){if(!a)return 1;if(a<18)return 1+(18-a)*.04;if(a<=35)return 1;if(a<=50)return 1+(a-35)*.01;return 1.15+(a-50)*.017;}

function pctOf(exId,e1,bw){
  const std=STD[sexKey()][exId]; if(!std||!(e1>0)||!(bw>0)) return null;
  const r=e1/bw*normFactor(bw), pts=[[0,0],...std.map((v,i)=>[v,STD_P[i]]),[std[4]*1.3,99.5]];

}

    next:lvl<4?{name:LEVELS[lvl+1],kg:std[lvl+1]/f*bw}:null,first,gain:cur-first,gainPct:(cur/first-1)*100,perWeek:(cur-first)/weeks,gain4:cur-base4,

const FORM=[{name:'Couch-Modus',min:0},{name:'Einsteiger',min:6},{name:'Aktiv',min:18},{name:'Fit',min:36},{name:'Athlet',min:60},{name:'Elite',min:95}];

function formInfo(){
  const t=Math.max(1,num(S.profile.weeklyTarget)||4), m=weekCounts(), keys=Object.keys(m).sort(), mon=mondayOf(new Date()), curK=dayKey(mon);
  let pts=0,sessions=0,full=0,missed=0,zero=0;
  if(keys.length){let w=parseDay(keys[0]),first=true,g=0;
    while(w<=mon&&g++<600){const k=dayKey(w),c=m[k]||0;
      pts+=Math.min(c,t+1);sessions+=Math.min(c,t+1);

function toast(msg,type='',ms=2600){
  const box=$('#toasts'); if(!box) return;
  const el=document.createElement('div'); el.className='toast '+type;
  el.innerHTML=(type==='pr'?'<b>NEUER REKORD</b>':'')+`<span>${esc(msg)}</span>`;
  box.appendChild(el); while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320);},ms);
}
let actx=null;
function unlockAudio(){try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}if(actx&&actx.state==='suspended')actx.resume();}catch{}}
function tone(f,t0,dur,type='square',vol=.12){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;const t=actx.currentTime+t0;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.03);}
function beep(){if(!S.profile.sound||!actx)return;try{tone(880,0,.16);tone(880,.24,.16);tone(1320,.48,.34);}catch{}}
function chime(){if(!S.profile.sound||!actx)return;try{tone(660,0,.14,'sine',.12);tone(990,.13,.26,'sine',.12);}catch{}}
function buzz(p){if(S.profile.vibrate&&navigator.vibrate)try{navigator.vibrate(p);}catch{}}

/* ---------- workout logic ---------- */
function makeEntry(exId,target,excludeId){
  const ex=exById(exId), rec=recommend(exId,target,excludeId), n=Math.max(1,num(target.sets)||3), sets=[];
  const defR=target.repMin??target.repMax??(ex.metric==='s'?30:ex.metric==='m'?30:8);
  for(let i=0;i<n;i++){
    const w=rec.w??(ex.load==='bw'?0:20);
    let r=rec.reps?(rec.reps[i]??rec.reps[rec.reps.length-1]):defR;
    if(rec.type==='up') r=target.repMin??target.repMax??r;
    sets.push({w,r,rpe:null,done:false});
  }
  return {id:uid(),exId,target:{...target},sets,skipped:false,deload:rec.type==='deload',deloadFrom:rec.type==='deload'?rec.from:undefined,
    rec:rec.text,recType:rec.type,last:lastSummary(exId,excludeId)};
}
function startWorkout(tplId){
  if(S.active){toast('Es läuft bereits ein Training.','err');ui.tab='train';render();return;}
  const t=S.templates.find(x=>x.id===tplId); if(!t) return;
  const c=campaign(), light=t.kind==='strength'&&c.light;
  const a={id:uid(),templateId:t.id,name:t.name,kind:t.kind,start:Date.now(),end:null,notes:'',light,entries:[],
    cardio:t.kind!=='strength'?{min:t.kind==='boxing'?60:30,km:t.kind==='run'?5:'',rpe:null}:null};
  for(const it of t.items) a.entries.push(makeEntry(it.exId,{sets:light?Math.max(1,num(it.sets)-1):num(it.sets),repMin:it.repMin,repMax:it.repMax,rest:it.rest}));
  S.active=a; save(true); requestWake(); ui.tab='train'; persistUI(); render(); scrollTo(0,0);
  buzz(40); toast(light?'Leichte Woche: 1 Satz weniger pro Übung.':`${t.name} gestartet – viel Kraft!`,'go');
}
const getEntry=id=>S.active?.entries.find(e=>e.id===id);
function livePR(e,s){
  if(e.prShown) return;
  const ex=exById(e.exId), b=derivedPR().bests[e.exId]; if(!b) return;
  const w=num(s.w), r=num(s.r); let msg=null;
  if(ex.metric==='reps'&&w>0&&r>0&&e1rm(w,r)>b.e1rm+1e-6) msg=`${ex.name}: ${fmtKg(w)} kg × ${fmt(r,0)} · e1RM ${fmt(e1rm(w,r),1)} kg`;
  else if(w>0&&r>0&&w>b.w+1e-6) msg=`${ex.name}: ${fmtKg(w)} kg`;
  else if(ex.load==='bw'&&w<=0&&b.w<=0&&r>b.reps) msg=`${ex.name}: ${fmt(r,0)} ${metricUnit(ex)}`;
  if(msg){e.prShown=true;celebratePR(msg);return true;}
  return false;
}
function checkSet(eid,j){
  const e=getEntry(eid); if(!e) return; const s=e.sets[j]; if(!s) return;
  s.done=true; s.at=Date.now(); buzz(30);
  if(!S.active.editing) livePR(e,s);
  save(); updateCard(eid); updateProgress();
  const all=S.active.entries.every(x=>x.skipped||x.sets.every(y=>y.done));
  if(all){stopTimer();toast('Alle Sätze erledigt. Tippe auf „Fertig“.','go',3500);}
  else if(S.profile.autoTimer) startTimer(num(e.target?.rest)||num(S.profile.restSec)||120);
}
function stepSet(el,dir){
  const e=getEntry(el.dataset.e); if(!e) return;
  const j=+el.dataset.s, f=el.dataset.f, ex=exById(e.exId), s=e.sets[j];
  const st=f==='w'?(num(ex.step)||2.5):(ex.metric==='reps'?1:5);
  const min=f==='w'?(ex.load==='bw'?-200:0):0;
  const old=num(s[f]); let v=Math.round((old+dir*st)*100)/100; if(v<min) v=min;
  s[f]=v; setInput(e.id,j,f,v);
  if(f==='w') propagateW(e,j,old,v);
  save();
}
function setInput(eid,j,f,v){const i=document.querySelector(`input[data-e="${eid}"][data-s="${j}"][data-f="${f}"]`);if(i)i.value=fmtInput(v);}
function propagateW(e,j,old,v){for(let k=j+1;k<e.sets.length;k++){const o=e.sets[k];if(o.done||num(o.w)!==old)break;o.w=v;setInput(e.id,k,'w',v);}}
function updateCard(eid){const i=S.active.entries.findIndex(e=>e.id===eid);const el=document.querySelector(`[data-card="${eid}"]`);if(el&&i>=0)el.outerHTML=renderEntry(S.active.entries[i],i);}
function updateProgress(){const p=$('#wo-prog');if(!p||!S.active)return;const {done,total}=activeCounts();p.style.width=(total?done/total*100:0)+'%';const c=$('#wo-count');if(c)c.textContent=`${done} von ${total} Sätzen`;}
function activeCounts(){let done=0,total=0;for(const e of S.active.entries){if(e.skipped)continue;total+=e.sets.length;done+=e.sets.filter(s=>s.done).length;}return {done,total};}

async function finishWorkout(){
  const a=S.active; if(!a) return;
  if(a.kind==='strength'){
    const {done,total}=activeCounts();
    if(done===0){if(!await confirmDlg('Noch kein Satz abgehakt. Training trotzdem speichern?','Speichern'))return;}
    else if(done<total){if(!await confirmDlg(`${total-done} Sätze sind nicht abgehakt und zählen nicht. Training beenden?`,'Beenden'))return;}
  } else if(!(num(a.cardio?.min)>0)){toast('Bitte Dauer eintragen.','err');return;}
  const s=deep(a), editing=!!s.editing, fBefore=formInfo().stage;
  delete s.timerEnd; delete s.timerTotal; delete s.editing;
  if(!editing) s.end=Date.now(); else s.end=s.end||Date.now();
  (s.entries||[]).forEach(e=>{delete e.prShown;});
  if(editing){const i=S.sessions.findIndex(x=>x.id===s.id);if(i>=0)S.sessions[i]=s;else S.sessions.push(s);} else S.sessions.push(s);
  S.active=null; stopTimer(); releaseWake(); save(true);
  const prs=derivedPR().prList.filter(p=>p.sid===s.id);
  const fAfter=formInfo().stage, formUp=!editing&&fAfter>fBefore?fAfter:null;
  render(); scrollTo(0,0);
  openSheet(summaryHTML({s,prs,editing,formUp}));
  if((prs.length||formUp!=null)&&!editing){buzz([60,40,140]);chime();}
}

/* ---------- charts (canvas, offline) ---------- */
const C={y:'#d8b56d',b:'#7aa2ff',c:'#5fd3c4',o:'#ff9f5a',g:'#5fd38d',grid:'#202024',txt:'#6f6f77'};
const charts=[];
function chartSlot(cfg){const id='ch'+charts.length;charts.push({id,cfg});return `<canvas class="chart" id="${id}" style="height:${cfg.height||200}px"></canvas>`;}
function drawCharts(){for(const {id,cfg} of charts){const cv=document.getElementById(id);if(cv)drawChart(cv,cfg);}}
function drawChart(cv,cfg){
  const H=cfg.height||200, W=cv.parentElement.clientWidth||300, dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=W+'px';cv.style.height=H+'px';cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const Pd={l:46,r:12,t:14,b:26}, pw=W-Pd.l-Pd.r, ph=H-Pd.t-Pd.b;
  const pts=[];(cfg.series||[]).forEach(s=>s.points.forEach(p=>pts.push(p)));(cfg.bars?.points||[]).forEach(p=>pts.push(p));
  g.font='500 11.5px Inter, system-ui, sans-serif';
  if(!pts.length){g.fillStyle=C.txt;g.textAlign='center';g.textBaseline='middle';g.fillText(cfg.empty||'Noch keine Daten',W/2,H/2);return;}
  let x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x));
  if(x0===x1){x0-=3*864e5;x1+=3*864e5;} const px=(x1-x0)*.05; x0-=px; x1+=px;
  const ys=pts.map(p=>p.y); if(cfg.goal!=null) ys.push(cfg.goal);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  if(cfg.bars){y0=0;y1=y1*1.12||1;} else {const sp=(y1-y0)||Math.abs(y1)*.1||1;y0-=sp*.15;y1+=sp*.15;}
  const X=x=>Pd.l+(x-x0)/(x1-x0)*pw, Y=y=>Pd.t+(1-(y-y0)/(y1-y0))*ph;
  const yf=cfg.yFmt||(v=>fmt(v,Math.abs(y1-y0)<5?1:0));
  g.lineWidth=1;g.strokeStyle=C.grid;g.fillStyle=C.txt;g.textAlign='right';g.textBaseline='middle';
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,y=Y(v);g.beginPath();g.moveTo(Pd.l,y);g.lineTo(W-Pd.r,y);g.stroke();g.fillText(yf(v),Pd.l-6,y);}
  g.textBaseline='top';
  [[x0+px,'left',Pd.l],[(x0+x1)/2,'center',null],[x1-px,'right',W-Pd.r]].forEach(([x,al,pos])=>{g.textAlign=al;g.fillText(fmtDate(x),pos??X(x),H-Pd.b+8);});
  if(cfg.goal!=null){const y=Y(cfg.goal);g.save();g.setLineDash([6,5]);g.strokeStyle=C.y;g.globalAlpha=.75;g.beginPath();g.moveTo(Pd.l,y);g.lineTo(W-Pd.r,y);g.stroke();g.restore();
    g.fillStyle=C.y;g.textAlign='right';g.textBaseline='bottom';g.fillText('Ziel '+fmt(cfg.goal,1),W-Pd.r,y-3);}
  if(cfg.bars){const bp=cfg.bars.points,bw=Math.max(6,Math.min(26,pw/Math.max(bp.length,1)*.55));g.fillStyle=cfg.bars.color||C.b;
    bp.forEach(p=>{const x=X(p.x),y=Y(p.y),h=Y(0)-y;g.beginPath();if(g.roundRect)g.roundRect(x-bw/2,y,bw,Math.max(h,1),[4,4,0,0]);else g.rect(x-bw/2,y,bw,Math.max(h,1));g.fill();});}
  for(const s of cfg.series||[]){const p=s.points;if(!p.length)continue;
    g.strokeStyle=s.color;g.fillStyle=s.color;g.lineWidth=s.width||2.5;g.lineJoin='round';g.lineCap='round';
    if(s.fill&&p.length>1){const gr=g.createLinearGradient(0,Pd.t,0,Pd.t+ph);gr.addColorStop(0,s.color+'40');gr.addColorStop(1,s.color+'00');g.fillStyle=gr;g.beginPath();g.moveTo(X(p[0].x),Y(y0));p.forEach(q=>g.lineTo(X(q.x),Y(q.y)));g.lineTo(X(p[p.length-1].x),Y(y0));g.closePath();g.fill();g.fillStyle=s.color;}
    if(s.line!==false&&p.length>1){g.beginPath();p.forEach((q,i)=>i?g.lineTo(X(q.x),Y(q.y)):g.moveTo(X(q.x),Y(q.y)));g.stroke();}
    if(s.dots!==false)p.forEach(q=>{g.beginPath();g.arc(X(q.x),Y(q.y),s.r||3.5,0,Math.PI*2);g.fill();});}
}

function kpis(){

function cmp(a,b){if(a===b||(b>0&&Math.abs(a-b)/b<.02))return 0;return a>b?1:-1;}
const cmpCls=v=>v>0?'up-c':v<0?'down-c':'eq-c', cmpArrow=v=>v>0?'▲':v<0?'▼':'=';
function statsWeek(){
  const mon=mondayOf(new Date()), a=weekStats(mon), b=weekStats(addDays(mon,-7),Date.now()-7*864e5), full=weekStats(addDays(mon,-7));
  const v=(a.vol||b.vol)?cmp(a.vol,b.vol):cmp(a.count,b.count);
  const word=v>0?'Besser':v<0?'Schlechter':'Gleich';
  const tile=(l,val,cur,prev,f)=>{const c=cmp(cur,prev);return `<div class="tile"><div class="l">${l}</div><div class="v">${val}</div><div class="d ${cmpCls(c)}">${cmpArrow(c)} Vorwoche ${f(prev)}</div></div>`;};
  let h=`<section class="card hero"><div class="eyebrow">Diese Woche · ${fmtDate(mon)}–${fmtDate(addDays(mon,6))}</div>
    <div class="verdict ${cmpCls(v)}">${word}</div><p class="muted" style="margin:4px 0 0">als die Vorwoche bis ${DAYS[new Date().getDay()]}${a.vol||b.vol?' (nach Volumen)':''}. Ganze Vorwoche: ${full.count} Einheiten · ${fmtT(full.vol)}</p>
    <div class="weekpips">${['MO','DI','MI','DO','FR','SA','SO'].map((d,i)=>`<div class="${a.days.has(i)?'on':''}">${d}<span></span></div>`).join('')}</div></section>
    <div class="tiles">${tile('Einheiten',a.count,a.count,b.count,x=>x)}${tile('Volumen',fmtT(a.vol),a.vol,b.vol,fmtT)}${tile('Sätze',a.sets,a.sets,b.sets,x=>x)}${tile('Rekorde',a.prs,a.prs,b.prs,x=>x)}
    ${tile('Laufen',fmt(a.runKm,1)+'<small>km</small>',a.runKm,b.runKm,x=>fmt(x,1)+' km')}${tile('Boxen',fmt(a.boxMin,0)+'<small>min</small>',a.boxMin,b.boxMin,x=>fmt(x,0)+' min')}</div>`;
  const pts=[],cnt=[];
  for(let i=7;i>=0;i--){const m=addDays(mon,-7*i),w=weekStats(m);pts.push({x:m.getTime(),y:w.vol});cnt.push({x:m.getTime(),y:w.count});}
  h+=`<h2>Volumen · 8 Wochen</h2><div class="card">${chartSlot({bars:{points:pts,color:C.b},yFmt:v=>v>=1000?fmt(v/1000,1)+'t':fmt(v,0),height:190})}</div>`;

  return h;
}

function statsBody(){

  const pts=list.map(e=>({x:parseDay(e.date).getTime(),y:e.kg}));
  h+=`<h2>Verlauf</h2><div class="card">${chartSlot({series:[{points:pts,color:C.b,line:false,r:3},{points:bwAvg(list),color:C.y,dots:false,width:3}],goal,height:210,empty:'Trage dein Gewicht ein'})}
    ${legend([[C.b,'Messung'],[C.y,'Ø 7 Tage'],[C.y,'Ziel (gestrichelt)']])}</div>`;
  const lifts=['squat','bench','deadlift','ohp'].map(id=>S.exercises.find(x=>x.id===id)).filter(Boolean);
  const cols=[C.y,C.b,C.c,C.o]; const series=[], rows=[];
  lifts.forEach((ex,i)=>{const s=exSeries(ex.id).filter(p=>p.e1rm>0).map(p=>({x:p.x,y:p.e1rm/bwAt(p.x)}));if(!s.length)return;
    series.push({points:s,color:cols[i],width:2.5});
    const first=s[0].y,last=s[s.length-1].y;rows.push({ex,col:cols[i],last,chg:first?(last/first-1)*100:0});});
  h+=`<h2>Kraft pro kg Körpergewicht</h2>`;
  if(!rows.length) h+=`<div class="card empty">${icon('scale',34)}Nach den ersten Trainings siehst du hier, wie du stärker wirst, während du abnimmst.</div>`;

    const avg=rows.reduce((a,r)=>a+r.chg,0)/rows.length;
    h+=`<div class="card"><p style="margin-bottom:12px"><b class="${avg>=0?'up-c':'down-c'}">${avg>=0?'+':''}${fmt(avg,1)} %</b> relative Kraft seit Beginn bei <b>${lost>=0?'−':'+'}${fmt(Math.abs(lost),1)} kg</b> Körpergewicht.</p>

      <p class="muted sm" style="margin:10px 0 0">e1RM geteilt durch dein Körpergewicht am Trainingstag.</p></div>`;
  }
  if(list.length){
    h+=`<h2>Messungen</h2><div class="card" style="padding:4px 16px">${list.slice(-10).reverse().map(e=>`<div class="srow"><span>${parseDay(e.date).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})}</span><span class="row"><b class="num" style="font-size:20px">${fmt(e.kg,1)} kg</b><button class="icon-btn" style="width:42px;height:42px" data-a="bw-del" data-d="${e.date}" aria-label="Messung löschen">${icon('trash',18)}</button></span></div>`).join('')}</div>`;
  }
  return h;
}

/* ---------- data export / import ---------- */
async function doExport(){
  try{
    const data=JSON.stringify({app:'VIGIL',exportedAt:new Date().toISOString(),...S},null,2);
    const name=`vigil-backup-${dayKey()}.json`;
    const file=new File([data],name,{type:'application/json'});
    const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
    if(ios&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'VIGIL Backup'});return;}
    const url=URL.createObjectURL(file), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000); toast('Backup exportiert: '+name,'go');
  }catch(e){if(e?.name!=='AbortError')toast('Export fehlgeschlagen: '+(e.message||e),'err');}
}
function doImport(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=async()=>{
    const f=inp.files?.[0]; if(!f) return;
    try{
      const d=JSON.parse(await f.text());
      if(!d||typeof d!=='object') throw new Error('keine gültige Datei');
      if(!Array.isArray(d.sessions)||!Array.isArray(d.templates)||!Array.isArray(d.exercises)) throw new Error('keine VIGIL-Sicherung');
      if(!await confirmDlg(`Sicherung mit ${d.sessions.length} Trainings laden? Deine aktuellen Daten werden ersetzt.`,'Importieren',true)) return;
      try{localStorage.setItem(KEY+'.before-import',JSON.stringify(S));}catch{}
      S=migrate(d); timer=null; save(true); render(); toast('Import erfolgreich.','go');
    }catch(e){toast('Import fehlgeschlagen: '+(e.message||e),'err',4500);}
  };
  inp.click();
}

    S.active={...deep(s),editing:true};if(!S.active.cardio&&s.kind!=='strength')S.active.cardio={min:'',km:'',rpe:null};save(true);closeSheet();ui.tab='train';render();scrollTo(0,0);},
  close:()=>closeSheet(),
  seg:el=>{ui.seg=el.dataset.v;persistUI();render();},
  'bw-step':el=>{const i=$('#bw-in');i.value=fmtInput(Math.max(0,Math.round((num(i.value)+ +el.dataset.d)*10)/10));},
  'bw-save':()=>{const kg=num($('#bw-in').value),date=$('#bw-date').value||dayKey();if(!(kg>20&&kg<400)){toast('Bitte ein gültiges Gewicht eingeben.','err');return;}
    if(date>dayKey()){toast('Datum liegt in der Zukunft.','err');return;}
    S.bodyweight=S.bodyweight.filter(e=>e.date!==date);S.bodyweight.push({date,kg:Math.round(kg*10)/10});save(true);
    render();toast(`${fmt(kg,1)} kg gespeichert.`,'go');},
  'bw-del':async el=>{if(!await confirmDlg('Messung löschen?','Löschen',true))return;S.bodyweight=S.bodyweight.filter(e=>e.date!==el.dataset.d);save(true);render();},
  'rest-def':el=>{S.profile.restSec=clamp(num(S.profile.restSec)+ +el.dataset.d,15,600);save();render();},
  'camp-restart':async()=>{if(!await confirmDlg('Neuen 12-Wochen-Zyklus ab dieser Woche starten?','Starten'))return;S.profile.campaignStart=dayKey(mondayOf(new Date()));save(true);render();toast('Zyklus gestartet – Phase Fundament.','go');},
  'tpl-edit':el=>openTplEditor(el.dataset.id), 'tpl-new':()=>openTplEditor(null),
  'di-add':()=>{draft.items.push({exId:S.exercises[0]?.id,sets:3,repMin:8,repMax:12,rest:num(S.profile.restSec)||120});setSheet(tplHTML());},
  'di-move':el=>{const L=draft.items,i=+el.dataset.i,j=i+ +el.dataset.d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];setSheet(tplHTML());},
  'di-del':el=>{draft.items.splice(+el.dataset.i,1);setSheet(tplHTML());},
  'tpl-save':()=>{if(!draft.name.trim()){toast('Bitte einen Namen eingeben.','err');return;}
    const t=deep(draft);delete t._new;t.name=t.name.trim();t.items=t.items.filter(i=>i.exId).map(i=>({...i,sets:Math.max(1,Math.round(num(i.sets))||1)}));
    if(t.kind!=='strength') t.items=[];
    const i=S.templates.findIndex(x=>x.id===t.id);if(i>=0)S.templates[i]=t;else S.templates.push(t);save(true);closeSheet();render();toast('Vorlage gespeichert.','go');},
  'tpl-del':async()=>{if(!await confirmDlg(`Vorlage „${draft.name}“ löschen? Vergangene Trainings bleiben erhalten.`,'Löschen',true))return;S.templates=S.templates.filter(t=>t.id!==draft.id);save(true);closeSheet();render();},
  'tpl-reset':async()=>{if(!await confirmDlg('Standard-Vorlagen (Kraft A/B, Boxen, Laufen) wiederherstellen? Eigene Änderungen an diesen Vorlagen gehen verloren.','Wiederherstellen',true))return;
    const def=defaultTemplates();for(const t of def){const i=S.templates.findIndex(x=>x.id===t.id);if(i>=0)S.templates[i]=t;else S.templates.push(t);}
    for(const x of defaultExercises()) if(!S.exercises.find(e=>e.id===x.id)) S.exercises.push(x);save(true);render();},
  'ex-edit':el=>openExEditor(el.dataset.id), 'ex-new':()=>openExEditor(null),
  'xd-save':el=>{const name=$('#xd-name').value.trim();if(!name){toast('Bitte einen Namen eingeben.','err');return;}
    const x={id:el.dataset.id,name,metric:$('#xd-metric').value,load:$('#xd-load').value,step:num($('#xd-step').value)||2.5,big:$('#xd-big').checked};
    const i=S.exercises.findIndex(e=>e.id===x.id);if(i>=0)S.exercises[i]=x;else S.exercises.push(x);save(true);closeSheet();render();},
  'xd-del':async el=>{const id=el.dataset.id;
    if(S.sessions.some(s=>s.entries?.some(e=>e.exId===id))||S.active?.entries.some(e=>e.exId===id)){toast('Übung hat bereits Trainingsdaten und kann nicht gelöscht werden – umbenennen geht.','err',4500);return;}
    if(!await confirmDlg('Übung löschen? Sie wird auch aus Vorlagen entfernt.','Löschen',true))return;
    S.exercises=S.exercises.filter(e=>e.id!==id);S.templates.forEach(t=>t.items=t.items.filter(i=>i.exId!==id));save(true);closeSheet();render();},
  export:()=>doExport(), import:()=>doImport(),
  reset:async()=>{if(!await confirmDlg('ALLE Daten löschen? Das kann nicht rückgängig gemacht werden. Exportiere vorher ein Backup!','Weiter',true))return;
    if(!await confirmDlg('Wirklich sicher? Alle Trainings, Gewichte und Erfolge werden gelöscht.','Endgültig löschen',true))return;
    S=defaultState();timer=null;releaseWake();save(true);ui.tab='train';render();toast('Alle Daten gelöscht.');},
  install:async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice;}catch{}deferredInstall=null;render();},
};
function cStep(k,dir){
  const c=S.active.cardio, st=k==='km'?.5:5;
  c[k]=Math.max(0,Math.round((num(c[k])+dir*st)*100)/100);
  const i=document.querySelector(`input[data-c="${k}"]`); if(i) i.value=fmtInput(c[k]);
  updatePace(); save();
}
function updatePace(){const p=$('#pace'),s=$('#speed');if(p)p.innerHTML=paceTxt(S.active.cardio);if(s)s.innerHTML=speedTxt(S.active.cardio);}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  unlockAudio();
  const fn=A[el.dataset.a]; if(!fn) return;
  e.preventDefault();
  try{fn(el,e);}catch(err){console.error(err);toast('Fehler: '+(err.message||err),'err',4000);}
});
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches('input[data-f],input[data-c],#bw-in')){t.dataset.old=String(num(t.value));setTimeout(()=>{try{t.select();}catch{}},0);}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('input[data-f]')&&S.active){const en=getEntry(t.dataset.e);if(!en)return;en.sets[+t.dataset.s][t.dataset.f]=num(t.value);save();return;}
  if(t.matches('input[data-c]')&&S.active){S.active.cardio[t.dataset.c]=num(t.value);updatePace();save();return;}
  if(t.matches('[data-notes]')&&S.active){S.active.notes=t.value;save();return;}
  if(t.matches('[data-search]')){const q=t.value.trim().toLowerCase();document.querySelectorAll('#plist .prow').forEach(r=>r.hidden=q&&!r.dataset.name.includes(q));return;}
  if(t.matches('[data-d]')&&draft){draft[t.dataset.d]=t.dataset.d==='day'?+t.value:t.value;return;}
  if(t.matches('[data-di]')&&draft){const it=draft.items[+t.dataset.di],f=t.dataset.df;it[f]=f==='exId'?t.value:(t.value.trim()===''?null:num(t.value));return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('input[data-f]')&&S.active){const en=getEntry(t.dataset.e);if(!en)return;const j=+t.dataset.s,f=t.dataset.f,v=num(t.value);en.sets[j][f]=v;t.value=fmtInput(v);if(f==='w')propagateW(en,j,num(t.dataset.old),v);save();return;}
  if(t.matches('input[data-c]')&&S.active){t.value=t.value===''?'':fmtInput(num(t.value));return;}
  if(t.matches('[data-stat-ex]')){ui.statEx=t.value;persistUI();render();return;}
  if(t.matches('[data-d="kind"]')&&draft){draft.kind=t.value;setSheet(tplHTML());return;}
  if(t.matches('[data-d="day"]')&&draft){draft.day=+t.value;return;}
  if(t.matches('[data-p]')){
    const k=t.dataset.p; let v=t.type==='checkbox'?t.checked:(t.dataset.num!==undefined?num(t.value):t.value);
    if(k==='weeklyTarget') v=clamp(Math.round(v)||4,1,14);
    if((k==='startWeight'||k==='goalWeight')&&!(v>20&&v<400)){toast('Bitte ein gültiges Gewicht eingeben.','err');t.value=fmtInput(S.profile[k]);return;}
    if(k==='campaignStart'&&!v) return;
    if(k==='birthYear'){const y=new Date().getFullYear();if(t.value.trim()==='')v='';else if(!(v>=y-99&&v<=y-10)){toast('Bitte ein gültiges Geburtsjahr eingeben.','err');t.value=S.profile.birthYear;return;}}
    if(k==='height'){if(t.value.trim()==='')v='';else if(!(v>=120&&v<=230)){toast('Bitte Größe in cm eingeben (120–230).','err');t.value=S.profile.height;return;}}
    S.profile[k]=v; save(true);
    if(k==='wakeLock'){v?requestWake():releaseWake();}
    if(t.dataset.num!==undefined&&v!=='') t.value=(k==='weeklyTarget'||k==='birthYear'||k==='height')?v:fmtInput(v);
    if(['weeklyTarget','campaignStart','sex','birthYear','height'].includes(k)){const y=scrollY;render();scrollTo(0,y);}
    return;
  }
});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-sn]')){const s=S.sessions.find(x=>x.id===t.dataset.sn);if(s){s.notes=t.value;save();}}});
document.addEventListener('change',e=>{if(e.target.matches('[data-sn]')){const y=scrollY;render();scrollTo(0,y);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input[data-f],input[data-c],#bw-in'))e.target.blur();if(e.key==='Escape')closeSheet();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S.active)requestWake();renderTimer();}else if(saveT)writeNow();});
addEventListener('pagehide',()=>{if(saveT)writeNow();});
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(drawCharts,150);});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(ui.tab==='profile')render();});
addEventListener('appinstalled',()=>{deferredInstall=null;toast('VIGIL installiert.','go');});

/* ---------- boot ---------- */
S=load(); loadUI();
if(S.active&&S.active.timerEnd&&S.active.timerEnd>Date.now()) timer={end:S.active.timerEnd,total:S.active.timerTotal||num(S.profile.restSec)||120};
if(S.active) requestWake();
render();
try{navigator.storage?.persist?.();}catch{}
if('serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW-Registrierung fehlgeschlagen',err)));
}
</script>
</body>
</html>
